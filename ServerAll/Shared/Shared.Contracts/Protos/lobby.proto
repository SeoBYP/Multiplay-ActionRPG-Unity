syntax = "proto3";

import "common.proto";
import "auth.proto";
import "user.proto";

package gameserver.lobby.v1;


option csharp_namespace = "GameServer.Grpc.DungeonLobby";

service DungeonLobbyService{
  // 방 생성
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  // 특정 방 정보 가져오기
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  // 방 목록 가져오기
  rpc GetRooms(GetRoomsRequest) returns (GetRoomsResponse);
  // 방 갱신
  rpc UpdateRoom(UpdateRoomRequest) returns (UpdateRoomResponse);
  // 방 참가
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
  // 방 떠남
  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
  // 방 시작
  rpc StartRoom(StartRoomRequest) returns (StartRoomResponse);

  // 방 구독 시작
  rpc SubscribeRoom(SubscribeRoomRequest) returns (stream SubscribeRoomResponse);
}



message CreateRoomRequest{
  string room_name = 1;
  int32 max_players = 2;
  // 플레이할 던전(스폰 레이아웃 키, spawn-layouts.json). 비우면 서버 기본 맵(MapIds.Default=dungeon_01).
  // 방 생성 시 던전이 결정·영속되며, StartRoom 은 이 값을 기본 맵으로 사용한다(4.3).
  string map_id = 3;
}

message CreateRoomResponse{
  gameserver.common.Result result = 1;
  RoomInfo room_info = 2;
  int64 created_at = 3; // Unix timestamp
}

message JoinRoomRequest
{
  int64 room_id = 1;
}

message JoinRoomResponse{
  gameserver.common.Result result = 1;
  RoomInfo room_info = 2;
}

message LeaveRoomRequest{
  int64 room_id = 1;
}

message LeaveRoomResponse{
  gameserver.common.Result result = 1;
}

message GetRoomRequest{
  int64 room_id = 1;
}

message GetRoomResponse{
  gameserver.common.Result result = 1;
  RoomInfo room_info = 2;
}

message GetRoomsRequest{
  int32 room_count = 1; // 가져올 방 목록 갯수
}

message GetRoomsResponse{
  gameserver.common.Result result = 1;
  repeated RoomInfo room_infos = 2;
}

message StartRoomRequest{
  int64 room_id = 1;
  // 비우면 서버 기본 맵(MapIds.Default=dungeon_01). 특정 맵을 강제할 때 지정(E2E 테스트 등).
  // ※ 정식 던전 선택(4.3)은 방 생성 시 맵 결정 — 그때 이 필드는 방 MapId 로 승격.
  string map_id = 2;
}

message StartRoomResponse{
  gameserver.common.Result result = 1;
  RoomInfo room_info = 2;
}

message UpdateRoomRequest{
  int64 room_id = 1;
  string room_name = 2;
  int32 max_players = 3;
}

message UpdateRoomResponse{
  gameserver.common.Result result = 1;
  RoomInfo room_info = 2;
}


message SubscribeRoomRequest{
  int64 room_id = 1;
}

message SubscribeRoomResponse{
  oneof payload{
    RoomUpdatedEvent update_event = 1;
    GameStartedEvent start_event = 2;
    GameSessionReadyEvent game_session_event = 3;
  }
}

message RoomUpdatedEvent{
  RoomInfo room_info = 1;
}

message GameStartedEvent{
  RoomInfo room_info = 1;

}

message GameSessionReadyEvent{
  string ip = 1;
  int32 port = 2;
}

message RoomInfo{
  int64 room_id = 1;
  string room_name = 2;
  int64 host_user_id = 3;
  repeated gameserver.user.v1.UserInfo current_players = 4;
  int32 max_players = 5;
  RoomStatusType status = 6;
  // 이 방이 플레이할 던전(spawn-layouts.json 키). 방 생성 시 결정·영속(4.3). 로비 목록/상세 표시용.
  string map_id = 7;
}

enum RoomStatusType{
  ROOM_STATUS_TYPE_UNSPECIFIED = 0;
  ROOM_STATUS_TYPE_WAITING = 1;
  ROOM_STATUS_TYPE_STARTING = 2;
  ROOM_STATUS_TYPE_PLAYING = 3;
  ROOM_STATUS_TYPE_CLOSED = 4;
}
