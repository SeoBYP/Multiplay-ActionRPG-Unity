syntax = "proto3";

import "common.proto";

package gameserver.user.v1;

option csharp_namespace = "GameServer.Grpc.User";

service UserService{
  rpc SetNickName(SetNicknameRequest) returns (SetNicknameResponse);
}

message SetNicknameRequest{
  string nickname = 1;
}

message SetNicknameResponse{
  gameserver.common.Result result = 1;
  UserInfo user = 2;
}

message UserInfo {
  string nick_name = 1;
  string public_id = 2;
  int64 current_room_id = 3;
}