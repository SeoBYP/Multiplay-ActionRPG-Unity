version: '3.8'

services:
  gameserver:
    build:
      context: ..                        # ServerAll/ 기준
      dockerfile: GameServer/Dockerfile
    ports:
      - "5131:5131"
      - "5132:5132"
    environment:
      ConnectionStrings__GameDb: "Host=gameserver-postgres;Port=5432;Database=gamedb;Username=gameuser;Password=gamepass123;"
      ConnectionStrings__Redis: "gameserver-redis:6379,abortConnect=false"
      GRAYLOG_HOST: gameserver-graylog
    env_file:
      - .env                             # Jwt__Secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gameserver-network
    develop:
      watch:
        - action: rebuild
          path: ../GameServer
          ignore: [ "**/obj/**", "**/bin/**" ]
        - action: rebuild
          path: ../Shared
          ignore: [ "**/obj/**", "**/bin/**" ]

  socketserver:
    build:
      context: ..
      dockerfile: SocketServer/Dockerfile
    ports:
      - "7777:7777"
    environment:
      Server__Ip: "0.0.0.0"             # appsettings.json의 Server.Ip 오버라이드
      ConnectionStrings__Redis: "gameserver-redis:6379,abortConnect=false"
      GRAYLOG_HOST: gameserver-graylog
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gameserver-network
    develop:
      watch:
        - action: rebuild
          path: ../SocketServer
          ignore: [ "**/obj/**", "**/bin/**" ]
        - action: rebuild
          path: ../Shared
          ignore: [ "**/obj/**", "**/bin/**" ]

  mongodb:
    image: mongo:7.0
    container_name: gameserver-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - gameserver-network

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: gameserver-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - gameserver-network

  graylog:
    image: graylog/graylog:5.2          # 6.0 → 5.2로 변경 admin / admin
    container_name: gameserver-graylog
    restart: unless-stopped
    environment:
      GRAYLOG_PASSWORD_SECRET: "somepasswordpeppersalt1234"  # 16자 이상
      GRAYLOG_ROOT_PASSWORD_SHA2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"  # echo -n "admin" | sha256sum
      GRAYLOG_HTTP_EXTERNAL_URI: "http://127.0.0.1:9000/"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
    ports:
      - "9000:9000"
      - "12201:12201/udp"
    depends_on:
      - mongodb
      - opensearch
    networks:
      - gameserver-network

  postgres:
    image: postgres:16-alpine
    container_name: gameserver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass123
      POSTGRES_DB: gamedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d gamedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gameserver-network

  redis:
    image: redis:7-alpine
    container_name: gameserver-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - gameserver-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gameserver-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gameserver.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gameserver-network

volumes:
  pgdata:
  redisdata:
  pgadmin-data:
  mongodb_data:     
  opensearch_data:   

networks:
  gameserver-network:
    driver: bridge
