syntax = "proto3";

import "common.proto";

package gameserver.auth.v1;

option csharp_namespace = "GameServer.Grpc.Auth";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string nickname = 3;
}

message RegisterResponse {
  gameserver.common.Result result = 1;  // ✅ 전체 패키지명
  UserInfo user = 2;  // field 번호 수정 (1, 2, 3 순서대로)
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  gameserver.common.Result result = 1;  // ✅ 전체 패키지명
  string access_token = 2;
  string session_id = 3;
  int64 expires_at = 4;
  UserInfo user = 5;
}

message LogoutRequest {
}

message LogoutResponse {
  gameserver.common.Result result = 1;  // ✅ 전체 패키지명
}

message UserInfo {
  int64 user_id = 1;
  string nick_name = 2;
  string email = 3;
  int64 created_at = 4;
}