syntax = "proto3";

import "common.proto";
import "user.proto";
package gameserver.auth.v1;

option csharp_namespace = "GameServer.Grpc.Auth";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  gameserver.common.Result result = 1;  // ✅ 전체 패키지명
  gameserver.user.v1.UserInfo user = 2;  // field 번호 수정 (1, 2, 3 순서대로)
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  gameserver.common.Result result = 1;  // ✅ 전체 패키지명
  string access_token = 2;
  string session_id = 3;
  int64 expires_at = 4;
  gameserver.user.v1.UserInfo user = 5;
}

message RefreshRequest{

}

message RefreshResponse{
  gameserver.common.Result result = 1;
  string access_token = 2;
  string session_id = 3;
  int64 expires_at = 4;
}

message LogoutRequest {
}

message LogoutResponse {
  gameserver.common.Result result = 1;  // ✅ 전체 패키지명
}


