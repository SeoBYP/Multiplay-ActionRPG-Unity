syntax = "proto3";

package gameserver.auth.v1;

option csharp_namespace = "GameServer.Grpc.Auth";

// 인증 서비스 정의
service AuthService{
  // 회원가입
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 로그인
  rpc Login(LoginRequest) returns (LoginResponse);
  // 로그아웃
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// 회원가입 요청
message RegisterRequest {
  string user_name = 1;
  string password = 2;
  string email = 3;
}

message RegisterResponse{
  bool success = 1;
  string message = 2;

  // 성공 시 유저 정보
  UserInfo user = 3;
}

// 로그인 요청
message LoginRequest {
  string user_name = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;

  // 성공 시 토큰 및 유저 정보
  string access_token = 3;
  string session_id = 4;
  int64 expires_at = 5;  // Unix timestamp
  UserInfo user = 6;
}

// 로그아웃 요청
message LogoutRequest {
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

// 공통 유저 정보
message UserInfo {
  int64 user_id = 1;
  string user_name = 2;
  string email = 3;
  int64 created_at = 4;  // Unix timestamp
}